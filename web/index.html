<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbfa;
    --fg: #16181d;
    --muted: #6b7280;
    --rule: #e3e3e0;
    --accent: #b8442c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101215;
      --fg: #eceef2;
      --muted: #8b929e;
      --rule: #24272e;
      --accent: #e2664a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.6 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  main { max-width: 34rem; }
  .tag {
    font-size: .75rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--accent);
  }
  h1 {
    margin: .4rem 0 0;
    font-size: clamp(2.5rem, 8vw, 3.75rem);
    letter-spacing: -.03em;
    font-weight: 600;
  }
  p { color: var(--muted); max-width: 30rem; }
  hr { border: 0; border-top: 1px solid var(--rule); margin: 1.75rem 0; }
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .8125rem;
    color: var(--fg);
  }
</style>
</head>
<body>
  <main>
    <div class="tag">Running locally</div>
    <h1>Jarvis</h1>
    <p>One information layer for emergency response. This page just confirms the local server is up.</p>
    <hr>
    <p><code>GET /health</code> &nbsp;·&nbsp; <code>GET /docs</code></p>
  </main>
</body>
</html>
